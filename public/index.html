<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RelayDeck v1.0</title>
<link rel="icon" type="image/png" href="/logo.png" />
<style>
:root {
	--bg:#05070a; --pane:#0a0f16; --pane2:#0d141d; --pane3:#111a24;
	--line:#1b2733; --line2:#24384a;
	--txt:#c9d8e8; --txt2:#7e93a8; --dim:#53687c;
	--cyan:#00e5ff; --mag:#ff2a6d; --lime:#74ff5a; --amber:#ffb627;
	--gc:0 0 12px rgba(0,229,255,.45); --gl:0 0 12px rgba(116,255,90,.4); --gm:0 0 12px rgba(255,42,109,.4);
	--mono:ui-monospace,Menlo,Consolas,'Segoe UI Mono','Liberation Mono',monospace;
	--disp:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
	--r:3px;
}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.55 var(--mono);-webkit-font-smoothing:antialiased;overflow-y:auto}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
	background:linear-gradient(rgba(0,229,255,.02) 1px,transparent 1px) 0 0/100% 46px,
	linear-gradient(90deg,rgba(0,229,255,.02) 1px,transparent 1px) 0 0/46px 100%,
	radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,229,255,.05),transparent 70%)}
::selection{background:rgba(0,229,255,.3);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2)}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}

/* ══════════════════════════════════════ estructura del panel */
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none;
	padding:12px 20px;border-bottom:1px solid var(--line);background:var(--pane)}
.bar h1{margin:0;font:700 15px/1 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:var(--gc)}
.bar h1 i{color:var(--cyan);font-style:normal}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tabs button{display:flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;
	font:500 12px/1 var(--mono);color:var(--txt2);background:var(--pane2);
	border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.tabs button:hover{color:var(--txt)}
.tabs button[aria-current=true]{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.1);box-shadow:var(--gc)}
.tabs button .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.tabs button .dot.ok{background:var(--lime);box-shadow:var(--gl)}
.tabs button .dot.warn{background:var(--amber)}
.tabs button .dot.bad{background:var(--mag)}

.grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;
	padding:14px 20px 20px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;padding-right:2px}

.pane{background:var(--pane);border:1px solid var(--line);border-radius:var(--r)}
.pane.grow{display:flex;flex-direction:column}
.pane>h2{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--pane2);
	display:flex;align-items:center;gap:9px;
	font:700 10px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--txt2)}
.pane>h2::before{content:'▚';color:var(--cyan)}
.pane>h2 .sp{margin-left:auto}
.pane>.in{padding:14px}
.pane.grow>.in{flex:1}
.pane>.in.flush{padding:0}

/* ══════════════════════════════════════ estado */
.verdict{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.verdict .big{font:700 19px/1 var(--mono);letter-spacing:.02em}
.verdict.ok .big{color:var(--lime);text-shadow:var(--gl)}
.verdict.warn .big{color:var(--amber)}
.verdict.bad .big{color:var(--mag);text-shadow:var(--gm)}
.verdict.idle .big{color:var(--dim)}
.verdict .why{font-size:11px;color:var(--txt2)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin-bottom:14px}
.facts>div{padding-left:9px;border-left:1px solid var(--line)}
.facts .k{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.facts .v{margin-top:2px;font-size:13px;word-break:break-all}
.facts .v.hot{color:var(--cyan)}
.facts .v.mut{color:var(--dim)}

/* ══════════════════════════════════════ botones */
button.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;
	min-height:32px;padding:0 13px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
	color:var(--txt);background:var(--pane3);border:1px solid var(--line2);border-radius:var(--r);
	cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s,box-shadow .12s}
button.b:hover:not(:disabled){color:var(--cyan);border-color:var(--cyan);box-shadow:var(--gc)}
button.b:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
button.b:disabled{opacity:.35;cursor:not-allowed}
button.b.go{color:#04141a;background:var(--cyan);border-color:var(--cyan);font-weight:700;box-shadow:var(--gc)}
button.b.go:hover:not(:disabled){filter:brightness(1.15);color:#04141a}
button.b.ko{color:var(--mag);border-color:rgba(255,42,109,.4)}
button.b.ko:hover:not(:disabled){border-color:var(--mag);color:var(--mag);box-shadow:var(--gm)}
button.b.on{color:var(--lime);border-color:var(--lime);box-shadow:var(--gl)}
button.b.xs{min-height:25px;padding:0 8px;font-size:10px;letter-spacing:.04em}
.row{display:flex;gap:7px;flex-wrap:wrap}

.tag{display:inline-flex;align-items:center;padding:2px 7px;border:1px solid;border-radius:2px;
	font-size:10px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.tag.ok{color:var(--lime);border-color:rgba(116,255,90,.45);background:rgba(116,255,90,.09)}
.tag.warn{color:var(--amber);border-color:rgba(255,182,39,.45);background:rgba(255,182,39,.09)}
.tag.bad{color:var(--mag);border-color:rgba(255,42,109,.45);background:rgba(255,42,109,.09)}
.tag.idle{color:var(--dim);border-color:var(--line2);background:var(--pane2)}
.tag.info{color:var(--cyan);border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.09)}

/* ══════════════════════════════════════ modelos */
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
.mbar .s{flex:1 1 150px;position:relative}
.mbar .s input{padding-left:27px}
.mbar .s::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--cyan);font-size:14px}
.chips{display:flex;gap:4px}
.chips button{min-height:26px;padding:0 8px;font:500 10px/1 var(--mono);letter-spacing:.05em;
	text-transform:uppercase;color:var(--txt2);background:transparent;border:1px solid var(--line2);
	border-radius:var(--r);cursor:pointer}
.chips button[aria-pressed=true]{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.09)}

.prog{padding:0 14px 10px}
.prog[hidden]{display:none}
.prog .bar2{height:3px;background:var(--pane3);overflow:hidden}
.prog .bar2 i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:var(--gc);transition:width .2s}
.prog .t{margin-top:5px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--cyan)}

#mt{max-height:420px;overflow-y:auto}
table.m{width:100%;border-collapse:collapse}
table.m th{position:sticky;top:0;z-index:2;padding:9px 12px;text-align:left;white-space:nowrap;
	font:500 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
	background:var(--pane2);border-bottom:1px solid var(--line2)}
table.m td{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
table.m tr:last-child td{border-bottom:0}
table.m tbody tr:hover{background:var(--pane2)}
table.m tbody tr.hit{background:rgba(116,255,90,.05)}
table.m tbody tr.cur{box-shadow:inset 2px 0 0 var(--cyan);background:rgba(0,229,255,.06)}
table.m .n{font-weight:500;word-break:break-all}
table.m tr.hit .n{color:var(--lime)}
table.m tr.cur .n{color:var(--cyan)}
table.m .w{margin-top:1px;font-size:10px;color:var(--dim)}
table.m td.a{text-align:right;white-space:nowrap}
table.m td.p{width:28px}
table.m input[type=checkbox]{width:13px;height:13px;accent-color:var(--cyan);cursor:pointer}

/* ══════════════════════════════════════ usar en */
.dest{display:flex;gap:5px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dest button{min-height:29px;padding:0 12px;font:500 11px/1 var(--mono);letter-spacing:.06em;
	color:var(--txt2);background:var(--pane2);border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.dest button[aria-pressed=true]{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.1)}

ol.gsteps{margin:0;padding:0;list-style:none;counter-reset:g}
ol.gsteps>li{position:relative;padding:0 0 15px 30px;counter-increment:g}
ol.gsteps>li::before{content:counter(g);position:absolute;left:0;top:0;
	display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
	font-size:10px;font-weight:700;color:var(--cyan);border:1px solid var(--cyan)}
ol.gsteps>li:last-child{padding-bottom:0}
ol.gsteps .h{font-size:13px;font-weight:500;color:#fff}
ol.gsteps .d{margin-top:3px;font-size:11px;color:var(--txt2)}
ol.gsteps .f{margin-top:5px;font-size:11px;color:var(--amber)}

.cmd{display:flex;align-items:stretch;gap:7px;margin-top:6px}
.cmd code{flex:1;padding:8px 10px;background:#04080c;border:1px solid var(--line2);border-radius:var(--r);
	font-size:12px;color:var(--cyan);overflow-x:auto;white-space:pre}
pre.j{margin:6px 0 0;padding:10px;background:#04080c;border:1px solid var(--line2);border-radius:var(--r);
	font:400 11.5px/1.6 var(--mono);color:var(--txt);overflow-x:auto}
pre.j .k2{color:var(--cyan)}

.note{display:flex;gap:9px;padding:10px 12px;border-radius:var(--r);font-size:12px;line-height:1.6;
	background:rgba(255,182,39,.07);border:1px solid rgba(255,182,39,.4)}
.note+.note{margin-top:8px}
.note.info{background:rgba(0,229,255,.06);border-color:rgba(0,229,255,.35)}
.note.ok{background:rgba(116,255,90,.06);border-color:rgba(116,255,90,.4)}
.note.bad{background:rgba(255,42,109,.07);border-color:rgba(255,42,109,.4)}
.note .i{flex:none;font-weight:700;color:var(--amber)}
.note.info .i{color:var(--cyan)} .note.ok .i{color:var(--lime)} .note.bad .i{color:var(--mag)}
.note strong{color:#fff}
.note p{margin:5px 0 0}
.note code{color:var(--cyan)}
.hint{margin:0;font-size:11px;color:var(--dim)}

/* ══════════════════════════════════════ plegable */
.fold{border-top:1px solid var(--line)}
.fold>button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;
	font:500 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
	color:var(--txt2);background:transparent;border:0;cursor:pointer;text-align:left}
.fold>button:hover{color:var(--cyan);background:var(--pane2)}
.fold>button .ar{color:var(--cyan);font-size:8px;transition:transform .15s}
.fold.on>button .ar{transform:rotate(90deg)}
.fold>button .sp{margin-left:auto}
.fold>.c{display:none;padding:0 14px 14px}
.fold.on>.c{display:block}

ul.ck{list-style:none;margin:0;padding:0}
ul.ck li{display:grid;grid-template-columns:15px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
ul.ck li:last-child{border-bottom:0}
ul.ck .mk{font-weight:700;text-align:center}
ul.ck .mk.pass{color:var(--lime)} ul.ck .mk.warn{color:var(--amber)}
ul.ck .mk.fail{color:var(--mag)} ul.ck .mk.idle{color:var(--dim)}
ul.ck .t2{font-size:12px}
ul.ck .d2{margin-top:1px;font-size:11px;color:var(--txt2);word-break:break-word}
ul.ck .ms{font-size:10px;color:var(--dim)}

/* ══════════════════════════════════════ formulario */
label.l{display:block;margin-bottom:5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt2)}
label.l s{color:var(--dim);text-decoration:none;letter-spacing:0;text-transform:none}
input[type=text],input[type=password],input[type=search],select{width:100%;min-height:33px;padding:0 10px;
	font:400 13px var(--mono);color:var(--txt);background:#04080c;border:1px solid var(--line2);border-radius:var(--r)}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:var(--gc)}
input::placeholder{color:var(--dim)}
.f{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ck2{display:flex;gap:9px;align-items:flex-start}
.ck2 input{flex:none;width:15px;height:15px;margin:2px 0 0;accent-color:var(--cyan);cursor:pointer}
.ck2 label{margin:0;font-size:12px;cursor:pointer}
.ck2 .s2{display:block;margin-top:2px;font-size:11px;color:var(--dim)}

.blank{padding:30px 18px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:var(--r)}
.blank b{display:block;margin-bottom:4px;color:var(--txt2);font-size:13px}

#toast{position:fixed;z-index:900;left:50%;bottom:20px;transform:translate(-50%,14px);max-width:90vw;
	padding:10px 17px;font-size:12px;color:var(--cyan);background:var(--pane);
	border:1px solid var(--cyan);border-radius:var(--r);box-shadow:var(--gc);
	opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{color:var(--mag);border-color:var(--mag);box-shadow:var(--gm)}

#modal{position:fixed;z-index:950;inset:0;display:none;place-items:center;padding:20px;
	background:rgba(3,5,8,.8);backdrop-filter:blur(3px)}
#modal.show{display:grid}
#modal .box{width:100%;max-width:540px;background:var(--pane);border:1px solid var(--cyan);
	border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.7)}
#modal .box>h2{margin:0;padding:12px 15px;border-bottom:1px solid var(--line);
	font:700 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
#modal .box>.in{padding:15px;max-height:70vh;overflow-y:auto}

.blink{display:inline-block;animation:bl .75s infinite alternate}
@keyframes bl{0%{opacity:.2;transform:scale(.85)}100%{opacity:1;transform:scale(1.2)}}

@media (max-width:1000px){
	.grid{grid-template-columns:1fr}
}
@media (max-width:640px){ .g2{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
	<header class="bar">
		<div style="display:flex;align-items:center;gap:10px">
			<img src="/logo.png" alt="RelayDeck" style="width:30px;height:30px;border-radius:4px;object-fit:cover;filter:drop-shadow(0 0 6px rgba(0,229,255,.45))" />
			<div>
				<h1 style="margin:0;font:700 15px/1 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:var(--gc)">RELAY<i>//</i>DECK <span style="font-size:10px;font-weight:400;color:var(--dim);margin-left:3px">v1.0</span></h1>
				<div style="font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:2px">by <span style="color:var(--cyan)">NextKool</span></div>
			</div>
		</div>
		<div style="display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap">
			<span style="font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">CONFIGURACIÓN ACTUAL LOCAL:</span>
			<div id="top-active" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>
		</div>
		<button class="b go" id="add">+ API</button>
	</header>

	<nav class="prov-bar" style="display:flex;align-items:center;gap:12px;padding:8px 20px;background:#03060a;border-bottom:1px solid var(--line);flex-wrap:wrap">
		<span style="font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap">PROVEEDORES:</span>
		<div class="tabs" id="tabs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
	</nav>

	<div class="grid" id="grid"></div>

	<footer style="padding:12px 20px;text-align:center;font-size:10.5px;color:var(--dim);border-top:1px solid var(--line);background:#03060a;margin-top:auto">
		<span>RELAY//DECK v1.0 &copy; 2026 NextKool. Todos los derechos reservados.</span>
	</footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"><div class="box"><h2 id="modal-t"></h2><div class="in" id="modal-c"></div></div></div>

<script>
'use strict'

/* ═════════════════════════════════════════════ constantes */

const VERD = {
	codex_ready:     { cls:'ok',   big:'FUNCIONA',        why:'Responde a la API que usa Codex.' },
	chat_only:       { cls:'warn', big:'SOLO CHAT',       why:'Necesita el traductor para Codex. Claude Code directo requiere que el relay implemente el protocolo Anthropic (/messages).' },
	no_responses:    { cls:'warn', big:'SOLO CHAT',       why:'No implementa Responses. Codex necesita el traductor; Claude Code directo solo funciona si tambien ofrece Anthropic (/messages).' },
	claude_only:     { cls:'info', big:'SOLO CLAUDE',      why:'Responde a Anthropic Messages (/v1/messages). Sirve directamente en Claude Code, no en Codex.' },
	client_blocked:  { cls:'warn', big:'BLOQUEA AL PANEL',why:'El relay rechaza al panel, no a tu key. Puede funcionarte igual.' },
	no_channel:      { cls:'warn', big:'MODELO SIN CANAL',why:'Tu key sirve. Elegi otro modelo en el panel de al lado.' },
	quota_exhausted: { cls:'warn', big:'CUOTA AGOTADA',   why:'Tu key sirve, pero ese modelo no tiene saldo.' },
	invalid_key:     { cls:'bad',  big:'KEY INVALIDA',    why:'La rechaza en los endpoints reales. Esta revocada o agotada.' },
	unreachable:     { cls:'bad',  big:'NO RESPONDE',     why:'No se pudo conectar. Revisa la URL.' },
	dead:            { cls:'bad',  big:'NO SIRVE',        why:'Responde, pero no de forma usable.' },
	unknown:         { cls:'idle', big:'INCOMPLETO',      why:'Faltan datos para decidir.' },
}
const MK = { pass:'✓', warn:'!', fail:'✕', ok:'✓', unsupported:'–' }
const CKO = ['reachable','client','auth','models','modelSupport','responses','modelScan',
	'modelRouting','streaming','chat','anthropic','latency','billing']
const CKL = {
	reachable:'Servidor alcanzable', client:'Cliente aceptado', auth:'API key valida',
	models:'Catalogo de modelos', modelSupport:'Metadatos del relay', responses:'Responses API',
	modelScan:'Barrido de modelos', modelRouting:'Enrutado del modelo', streaming:'Streaming SSE',
	chat:'Chat Completions', anthropic:'Anthropic Messages', latency:'Tiempo de respuesta', billing:'Saldo restante',
}
const DESTS = [['codex','Codex CLI'], ['claude','Claude Code'], ['curl','Probar a mano']]

/* ═════════════════════════════════════════════ estado */

const S = {
	list: [], sel: null, adding: false, editing: false, conflict: null,
	reports: {}, cats: {}, res: {}, guides: {}, keys: {}, dest: 'codex',
	q: '', filter: 'all', picked: new Set(), fold: {}, cfg: null, plan: null,
	opts: {}, right: 'use', file: null, fileWhich: 'codex', fileDirty: false, fileProblems: [],
	scan: null, scanning: false, selectedModel: {},
}

const $ = (s, r = document) => r.querySelector(s)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
	({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
const cur = () => S.list.find((p) => p.id === S.sel) || null
const curModel = (p) => S.selectedModel?.[p.id] || p.model || S.cats[p.id]?.models?.[0] || ''
const tag = (c, t) => `<span class="tag ${c}">${esc(t)}</span>`
const money = (v) => (typeof v === 'number' && !Number.isNaN(v) ? '$' + v.toFixed(2) : null)

function resultProtocol(r) {
	const raw = String(r?.target || r?.protocol || '').toLowerCase()
	if (['codex', 'responses', 'response'].includes(raw)) return 'responses'
	if (['claude', 'anthropic', 'messages'].includes(raw)) return 'anthropic'
	if (['chat', 'chat-completions', 'chat_completions'].includes(raw)) return 'chat'
	const detail = String(r?.detail || '').toLowerCase()
	if (detail.includes('/messages')) return 'anthropic'
	if (detail.includes('/chat/completions')) return 'chat'
	if (detail.includes('/responses')) return 'responses'
	return ''
}

const SVG_INFO = `<svg style="width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.75" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`
const SVG_HELP = `<svg style="width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`

function protocolLabel(r) {
	return { responses:'Responses', anthropic:'Anthropic', chat:'Chat Completions' }[resultProtocol(r)] || ''
}

function maskKey(key) {
	const k = String(key || '').trim()
	if (!k) return ''
	if (k.length <= 11) return k.slice(0, 3) + '************' + k.slice(-2)
	return k.slice(0, 7) + '************' + k.slice(-4)
}

function maskKeyInText(text, key) {
	if (!text || !key || key.length < 8) return text
	return String(text).split(key).join(maskKey(key))
}

function resultHtml(r) {
	const protocol = protocolLabel(r)
	if (r.ok) {
		const cls = resultProtocol(r) === 'chat' ? 'warn' : resultProtocol(r) === 'anthropic' ? 'info' : 'ok'
		return `<span class="tag ${cls}" style="display:inline-flex;align-items:center;gap:5px">✓ ${esc(protocol || 'funciona')}${r.ms ? ` (${r.ms}ms)` : ''} ${SVG_INFO}</span>`
	}
	return `<span class="tag bad" style="display:inline-flex;align-items:center;gap:5px">✕ ${esc(r.reason || 'falla')} ${SVG_INFO}</span>`
}

let tt
function toast(m, bad) {
	const el = $('#toast')
	el.textContent = m
	el.classList.toggle('err', Boolean(bad))
	el.classList.add('show')
	clearTimeout(tt)
	tt = setTimeout(() => el.classList.remove('show'), 4200)
}

async function api(path, body, signal) {
	const r = await fetch(path, {
		method: body ? 'POST' : 'GET',
		headers: body ? { 'Content-Type':'application/json' } : undefined,
		body: body ? JSON.stringify(body) : undefined,
		signal,
	})
	const d = await r.json().catch(() => ({}))
	if (!r.ok) throw new Error(d.error || `Error ${r.status}`)
	return d
}

	const proto = resultProtocol(r)
	let title = `Estado de ${model}`

	const p = S.list.find((x) => x.id === activeId)
	const model = activeP?.model || S.cfg?.activeModel || p?.model || ''

	// Claude Code match
	const cleanHost = (u) => {
		try {
			return new URL(String(u).startsWith('http') ? u : 'https://' + u).hostname.replace(/^www\./, '')
		} catch {
			return String(u || '').replace(/^https?:\/\//i, '').split('/')[0]
		}

	const claudeBase = S.claude?.baseUrl ? String(S.claude.baseUrl).replace(/\/v1\/?$/i, '').trim() : ''

			</div>

			${p.sharesRelay ? `<div class="note" style="margin-top:12px"><span class="i">!</span><div>
				<strong>Otra API apunta a esta misma URL.</strong> Borra la que no uses.</div></div>` : ''}
		</div>
		${fold(p, 'diag', 'Diagnostico tecnico',
			r?.checks ? tag('idle', Object.keys(r.checks).length) : '', () => checks(p))}

function checks(p) {
	const r = S.reports[p.id] || p.lastTest
	if (!r?.checks) return '<p class="hint">Sin diagnostico todavia.</p>'
	return `<ul class="ck">${CKO.filter((k) => r.checks[k]).map((k) => {
		const c = r.checks[k]
		const st = c.status === 'ok' ? 'pass' : c.status === 'unsupported' ? 'idle' : c.status
		let d = c.detail || ''
		if (k === 'billing' && c.status === 'ok' && !c.unlimited) d = `Restante ${money(c.remaining)}. ${d}`
		return `<li><span class="mk ${st}">${MK[c.status] || '–'}</span>
			<span><span class="t2">${esc(CKL[k] || k)}</span><span class="d2">${esc(d)}</span></span>
			<span class="ms">${c.ms ? c.ms + ' ms' : ''}</span></li>`
	}).join('')}</ul>`
}

/**
 * Lo que hay AHORA en el config.toml del usuario, leido de verdad. Antes el
 * panel escribia a ciegas; esto es para poder ver que va a tocar.
 */
function cfgView() {
	const c = S.cfg
	if (!c) return `<div class="row"><button class="b" data-a="cfg">Leer mi config.toml</button></div>`
	if (!c.exists) return `<p class="hint">Todavia no existe ${esc(c.path)}. Se creara al instalar.</p>`

	const probs = []
	for (const t of c.problems.duplicateTables) probs.push(`la tabla [${t.table}] esta ${t.count} veces`)
	for (const k of c.problems.duplicateKeys) probs.push(`${k.key} esta ${k.count} veces en ${k.table ? '[' + k.table + ']' : 'la raiz'}`)
	for (const st of c.stray) probs.push(`${st.key} quedo dentro de [${st.table}], donde no vale`)

	return `<div class="facts" style="margin-bottom:11px">
			<div><div class="k">Activo ahora</div><div class="v ${c.activeProvider ? 'hot' : 'mut'}">${esc(c.activeProvider || 'ninguno')}</div></div>
			<div><div class="k">Modelo</div><div class="v">${esc(c.activeModel || '—')}</div></div>
			<div><div class="k">Proveedores</div><div class="v">${c.providers.length}</div></div>
		</div>
		<p class="hint">${esc(c.path)}</p>
		${c.providers.length ? `<ul style="margin:8px 0 0;padding-left:17px;font-size:11px;color:var(--txt2)">
			${c.providers.map((x) => `<li><code style="color:var(--cyan)">${esc(x.id)}</code> ${esc(x.baseUrl || '')}
				${x.id === c.activeProvider ? ' ← activo' : ''}</li>`).join('')}</ul>` : ''}
		${c.otherTables.length ? `<p class="hint" style="margin-top:8px">Otras secciones tuyas, intactas:
			${esc(c.otherTables.join(', '))}</p>` : ''}
		${probs.length ? `<div class="note bad" style="margin-top:11px"><span class="i">!</span><div>
			<strong>Este archivo tiene ${probs.length} problema(s) que rompen a Codex.</strong>
			<ul>${probs.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
			<p>Lo dejo valido sin cambiar tu proveedor activo.</p>
			<div class="row" style="margin-top:9px"><button class="b go" data-a="repair">Reparar config.toml</button></div>
			</div></div>`
			: `<div class="note ok" style="margin-top:11px"><span class="i">✓</span><div>
				<strong>TOML valido.</strong> Sin claves ni tablas duplicadas: Codex lo acepta.</div></div>`}

		${!c.clean ? `<div class="note" style="margin-top:11px"><span class="i">!</span><div>
			<strong>Valido, pero sucio.</strong> Nada de esto rompe a Codex; solo estorba:
			<ul>${c.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
			${c.duplicateRelays.length ? `<p>Suele pasar por registrar la misma API dos veces con el nombre algo
				distinto. Solo uno esta activo (<code>${esc(c.activeProvider || '')}</code>); el otro no hace nada.</p>` : ''}
			${c.legacyTuning.length ? `<p>Los <code>request_max_retries</code> y compania los escribio una version
				anterior del panel, no tu. Ya no se escriben salvo que el relay vaya lento.</p>` : ''}
			<div class="row" style="margin-top:9px">
				<button class="b go" data-a="clean">Limpiar${
					c.orphans.length ? ` (quitar ${esc(c.orphans.join(', '))})` : ''
				}</button>
			</div>
			<p class="hint" style="margin-top:6px">Nunca se toca el proveedor activo ni tus otras secciones.</p>
			</div></div>` : ''}
		<div class="row" style="margin-top:11px">
			<button class="b" data-a="cfg">Volver a leer</button>
			<button class="b" data-a="plan" data-p="${esc(S.sel)}">Ver que cambiaria al instalar</button>
		</div>
		${S.plan ? planView() : ''}`
}

function planView() {
	const r = S.plan
	if (!r.changed.length) return `<div class="note ok" style="margin-top:10px"><span class="i">✓</span>
		<div>Nada que cambiar: el config ya esta como toca.</div></div>`
	return `<div style="margin-top:10px"><p class="hint">Cambios exactos, linea por linea:</p>
		<pre class="j">${r.changed.map((c) =>
			`${c.table ? '[' + esc(c.table) + '] ' : 'raiz  '}${esc(c.key)}: ${esc(c.from ?? '(no existia)')} -> ${esc(c.to)}`
		).join('\n')}</pre>
		${r.kept?.length ? `<p class="hint">Se respetan tus claves: ${esc(r.kept.map((k) => k.key).join(', '))}</p>` : ''}
		${r.relocated?.length ? `<p class="hint">Se sacan de la tabla del proveedor a la raiz: ${esc(r.relocated.map((k) => k.key).join(', '))}</p>` : ''}
	</div>`
}

const LABELS = {
	'': '— no escribir (deja lo que haya) —',
	minimal: 'minimal', low: 'low', medium: 'medium', high: 'high', xhigh: 'xhigh',
	untrusted: 'untrusted — pregunta casi todo',
	'on-request': 'on-request — pregunta cuando hace falta',
	never: 'never — no pregunta nunca',
	'read-only': 'read-only — solo lectura',
	'workspace-write': 'workspace-write — escribe en el proyecto',
	'danger-full-access': 'danger-full-access — sin limites',
}

function sel(name, key, value, help, recommendedVal) {
	const list = S.opts[key] || []
	return `<div class="f"><label class="l" for="s-${name}">${esc(help)}</label>
		<select id="s-${name}" name="${name}">${list.map((o) => {
			const label = esc(LABELS[o] ?? o)
			const isRec = o === recommendedVal
			return `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${label}${isRec ? ' ★ (RECOMENDADO)' : ''}</option>`
		}).join('')}</select></div>`
}

/* ═════════════════════════════════════════════ panel: modelos */

function rows(p) {
	const cat = S.cats[p.id]
	if (!cat) return []
	const res = S.res[p.id] || {}
	const dec = new Set(cat.declaresResponses || [])
	const q = S.q.trim().toLowerCase()
	return cat.models
		.filter((m) => {
			if (q && !m.toLowerCase().includes(q)) return false
			const r = res[m]
			if (S.filter === 'ok') return r?.ok
			if (S.filter === 'untested') return !r
			return true
		})
		.map((m) => ({ m, r: res[m], dec: dec.has(m) }))
}

function tableHtml(p) {
	const rs = rows(p)
	if (!rs.length) return '<div style="padding:14px"><p class="hint">Nada coincide con el filtro.</p></div>'
	const active = curModel(p)
	return `<table class="m"><thead><tr>
		<th>Modelo</th>
		<th style="cursor:pointer" data-a="showallstatus">
			Estado <span class="tag info" style="font-size:9.5px;padding:2px 6px;margin-left:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px">${SVG_HELP} Guía</span>
		</th>
		<th style="text-align:right"></th></tr></thead>
		<tbody>${rs.map(({ m, r, dec }) => {
			const inScan = S.scanning && S.scanType === 'all' && !r
			const isTrying = S.trying?.has(m) || inScan
			const isCur = p.model === m
			const isSel = active === m
			const statusIcon = !r
				? ''
				: r.ok
					? `<span style="color:var(--lime);font-weight:700;font-size:12px;margin-right:2px">✓</span>`
					: `<span style="color:var(--mag);font-weight:700;font-size:12px;margin-right:2px">✕</span>`
			const st = isTrying
				? `<span class="tag warn"><span class="blink">●</span> probando...</span>`
				: !r
					? `<span class="tag idle" data-a="showstatus" data-p="${esc(p.id)}" data-m="${esc(m)}" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px">sin probar ${SVG_INFO}</span>`
					: `<span data-a="showstatus" data-p="${esc(p.id)}" data-m="${esc(m)}" style="cursor:pointer">${resultHtml(r)}</span>`
			return `<tr class="${r?.ok ? 'hit' : ''} ${isSel ? 'cur' : ''}" data-a="pickmodel" data-p="${esc(p.id)}" data-m="${esc(m)}" style="cursor:pointer">
				<td>
					<div class="n" style="display:flex;align-items:center;gap:6px">
						${statusIcon}<span>${esc(m)}</span>
						${isCur ? `<span class="tag ok" style="font-size:9px;padding:2px 6px">✓ EN CONFIG</span>` : isSel ? `<span class="tag info" style="font-size:9px;padding:2px 6px">ELEGIDO</span>` : ''}
					</div>
					${dec ? '<div class="w">el relay lo declara compatible con Responses</div>' : r?.detail ? `<div class="w">${esc(r.detail.slice(0,80))}</div>` : ''}
				</td>
				<td>${st}</td>
				<td class="a" style="text-align:right">
					<button class="b xs" data-a="try" data-p="${esc(p.id)}" data-m="${esc(m)}" ${isTrying ? 'disabled style="color:var(--cyan);border-color:var(--cyan)"' : ''}>
						${isTrying ? 'Probando <span class="blink">...</span>' : 'Probar'}
					</button>
				</td>
			</tr>`
		}).join('')}</tbody></table>`
}

function paneModels(p) {
	const cat = S.cats[p.id]
	if (!cat) {
		return `<section class="pane grow"><h2>Modelos de ${esc(p.label)}</h2>
			<div class="in"><div class="blank"><b>Sin cargar</b>
			<div class="row" style="margin-top:10px;justify-content:center">
			<button class="b go" data-a="cat" data-p="${esc(p.id)}">Cargar modelos</button></div></div></div></section>`
	}
	const active = curModel(p)
	return `<section class="pane grow">
		<h2>Modelos de ${esc(p.label)}<span class="sp"></span>${active ? tag('info', 'Elegido: ' + active) : tag('idle', 'Sin modelo')}</h2>
		<div class="mbar">
			<div class="s"><input type="search" data-a="q" value="${esc(S.q)}"
				placeholder="buscar: gpt, codex, claude..." aria-label="Buscar modelo" /></div>
			<div class="chips">${[['all','Todos'],['ok','Funcionan'],['untested','Sin probar']]

		<div class="in flush" id="mt">${tableHtml(p)}</div>

/* ═════════════════════════════════════════════ panel: usar en */

function paneUse(p) {
	const m = curModel(p)
	const guideKey = `${S.dest}:${m || 'none'}`
	const g = S.guides[p.id]?.[guideKey] || (S.guides[p.id]?.[S.dest]?.model === m ? S.guides[p.id]?.[S.dest] : null)
	const isConfiguredWithThisModel = p.installed && p.model === m
	const needsInstall = !p.installed
	const canAct = Boolean(m)
	const testedProtocol = resultProtocol(S.res[p.id]?.[m])
	const anthSupported = p.supports?.anthropic ?? p.lastTest?.supports?.anthropic ?? (g?.supported !== undefined ? g.supported : null)
	const claudeBlocked = S.dest === 'claude' && (testedProtocol === 'chat' || anthSupported === false)
	const claudeNotice = S.dest !== 'claude' ? '' : testedProtocol === 'anthropic' || anthSupported === true
		? `<div class="note ok" style="margin-bottom:12px"><span class="i">✓</span><div><strong>Protocolo Anthropic verificado.</strong> El modelo respondio a <code>/messages</code>.</div></div>`
		: `<div class="note" style="margin-bottom:12px"><span class="i">!</span><div><strong>Compatibilidad Anthropic no verificada.</strong> Claude Code directo requiere <code>/messages</code>; responder por ${testedProtocol === 'responses' ? 'Responses' : testedProtocol === 'chat' ? 'Chat' : 'otro protocolo'} no es suficiente.</div></div>`

	let body
	if (!canAct) {
		body = `<div class="blank"><b>Elegi un modelo primero</b>
			Haz clic en un modelo de la tabla izquierda.</div>`
	} else if (claudeBlocked || (S.dest === 'claude' && g && g.supported === false)) {
		body = `<div class="note bad"><span class="i">!</span><div>
			<strong>Este proveedor no soporta el protocolo Anthropic (/messages).</strong>
			<p>Claude Code no puede usarlo directamente. No se ofrece configurarlo porque fallará.</p></div></div>`
	} else if (needsInstall) {
		body = `<div class="note info"><span class="i">i</span><div>
			<strong>Falta instalarlo en Codex con <code>${esc(m)}</code>.</strong>
			<p>Escribe el proveedor en <code>config.toml</code> como activo, para que te baste
			escribir <code>codex</code>. Un solo archivo, sin perfiles.</p></div></div>
			<div class="row" style="margin-top:12px">
			<button class="b go" data-a="use" data-p="${esc(p.id)}" data-m="${esc(m)}">Instalar y usar ${esc(m)} en Codex</button></div>`
	} else if (!isConfiguredWithThisModel && S.dest === 'codex') {
		body = `<div class="note info"><span class="i">i</span><div>
			<strong>Cambiar modelo activo a <code>${esc(m)}</code>.</strong>
			<p>El proveedor ya está instalado en Codex con <code>${esc(p.model || 'otro')}</code>. Pulsa el botón para activar <code>${esc(m)}</code>.</p></div></div>
			<div class="row" style="margin-top:12px">
			<button class="b go" data-a="use" data-p="${esc(p.id)}" data-m="${esc(m)}">Usar ${esc(m)} en Codex</button></div>`
	} else if (!g) {
		if (!S.loadingGuide?.[p.id + ':' + S.dest]) {
			S.loadingGuide = S.loadingGuide || {}
			S.loadingGuide[p.id + ':' + S.dest] = true
			setTimeout(() => loadGuide(p.id), 0)
		}
		body = `<p class="hint">Cargando instrucciones...</p>`
	} else {
		const bridgeNotice = S.dest === 'codex' && p.useBridge
			? `<div class="note warn" style="margin-bottom:12px"><span class="i">⚡</span><div><strong>Requiere servidor Node activo:</strong> Gorouter solo ofrece Chat Completions y Codex CLI exige Responses. El panel traduce las peticiones en segundo plano en <code>127.0.0.1</code>, por lo que debes mantener <code>node server.js</code> encendido mientras uses Codex.</div></div>`
			: S.dest === 'codex'
			? `<div class="note ok" style="margin-bottom:12px"><span class="i">✓</span><div><strong>Conexión directa a internet:</strong> Este proveedor soporta Responses de forma nativa. Puedes cerrar el panel y apagar <code>node server.js</code>; Codex funcionará directamente.</div></div>`
			: ''
		body = `${claudeNotice}${bridgeNotice}
		${isConfiguredWithThisModel ? `<div class="note ok" style="margin-bottom:12px"><span class="i">✓</span><div><strong>Modelo activo en config.toml:</strong> <code>${esc(m)}</code></div></div>` : ''}
		<ol class="gsteps">${g.steps.map((st) => `<li>
			<div class="h">${esc(st.title)}</div>
			${st.cmds ? st.cmds.map((c) => {
				const raw = typeof c === 'string' ? c : c.cmd
				const key = S.keys[p.id] || p.apiKey || ''
				const disp = maskKeyInText(raw, key)
				return `<div class="cmd"><code>${esc(disp)}</code>
					<button class="b xs" data-a="copy" data-t="${esc(raw)}">Copiar</button></div>`
			}).join('') : ''}
			${st.file ? `<div class="f">Archivo: ${esc(st.file)}</div>` : ''}
			${st.json ? (() => {
				const rawJson = st.json
				const key = S.keys[p.id] || p.apiKey || ''
				const dispJson = maskKeyInText(rawJson, key)
				return `<pre class="j">${esc(dispJson)}</pre>
					<div class="row" style="margin-top:6px">
					<button class="b xs" data-a="copy" data-t="${esc(rawJson)}">Copiar JSON</button>
					${g.supported !== false ? `<button class="b xs go" data-a="applyclaude" data-p="${esc(p.id)}">Escribirlo por mi</button>` : ''}</div>`
			})() : ''}
			${st.detail ? `<div class="d">${esc(st.detail)}</div>` : ''}
		</li>`).join('')}</ol>
		${g.notes?.length ? `<div class="note" style="margin-top:13px"><span class="i">!</span>
			<div>${g.notes.map((n) => `<div>${esc(n)}</div>`).join('')}</div></div>` : ''}`
	}

	return `<section class="pane grow">
		<h2>Cómo usarlo</h2>
		<div class="dest">${DESTS.map(([d, t]) =>
			`<button data-a="dest" data-d="${d}" aria-pressed="${S.dest === d}">${t}</button>`).join('')}</div>
		<div class="in">
			${body}
			${S.dest === 'codex' && m ? fold(p, 'settings', 'Ajustes opcionales de Codex CLI (config.toml)',
				p.installed ? tag('ok','guardado') : tag('idle','opcional'), () => settingsFormHtml(p)) : ''}
		</div>
	</section>`
}

/* ═════════════════════════════════════════════ formulario */

/* ═════════════════════════════════════════════ plegable */

function fold(p, key, title, right, inner) {
	const on = S.fold[key]
	return `<div class="fold ${on ? 'on' : ''}">
		<button data-a="fold" data-k="${esc(key)}" aria-expanded="${Boolean(on)}">
			<span class="ar">▶</span>${esc(title)}<span class="sp"></span>${right || ''}</button>
		<div class="c">${on ? inner() : ''}</div></div>`
}

/* ═════════════════════════════════════════════ render */

function render() {
	renderTabs()
	const p = cur()

	if (S.adding || S.editing) {
		const target = S.editing ? p : null
		$('#grid').innerHTML = `<div class="col"><section class="pane">
			<h2>${target ? 'Editar ' + esc(target.label) : 'Agregar API'}</h2>
			<div class="in">${formHtml(target)}</div></section></div>
			<div class="col">${p && !S.adding ? paneUse(p) : `<section class="pane"><h2>Como funciona</h2>
				<div class="in"><ol class="gsteps">
				<li><div class="h">Agrega la API</div><div class="d">URL con /v1 y la key.</div></li>
				<li><div class="h">Elegi el modelo</div><div class="d">El panel prueba cual responde.</div></li>
				<li><div class="h">Usalo</div><div class="d">Te da los comandos para cada cliente cuando el relay soporta su protocolo.</div></li>
				</ol></div></section>`}</div>`
		return
	}

	if (!S.list.length) {
		$('#grid').innerHTML = `<div class="col"><section class="pane"><h2>Sin APIs</h2>
			<div class="in"><div class="blank"><b>Todavia no agregaste ninguna API</b>
			<div class="row" style="margin-top:10px;justify-content:center">
			<button class="b go" data-a="add">+ Agregar la primera</button></div></div></div></section></div>
			<div class="col"></div>`
		return
	}
	if (!p) { S.sel = S.list[0].id; return render() }
	const m = curModel(p)

	$('#grid').innerHTML = `
		<div class="col">${paneStatus(p)}${paneModels(p)}</div>
		<div class="col">
			<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.2);border-radius:var(--r);font-size:11px">
				<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
					<span style="font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">PROVEEDOR:</span>
					<span class="tag ok" style="font-weight:700;font-size:11px;padding:2px 7px">${esc(p.label)}</span>
					<span style="color:var(--dim);font-weight:700">➔</span>
					<span style="font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">MODELO:</span>
					<span class="tag info" style="font-weight:700;font-size:11px;padding:2px 7px">${esc(m || 'sin modelo')}</span>
				</div>
			</div>
			<div class="dest" style="border:1px solid var(--line);border-radius:var(--r);background:var(--pane)">
				<button data-a="right" data-d="use" aria-pressed="${S.right === 'use'}">Como usarlo</button>
				<button data-a="right" data-d="chat" aria-pressed="${S.right === 'chat'}">Chat de prueba</button>
				<button data-a="right" data-d="files" aria-pressed="${S.right === 'files'}">Editar archivos</button>
			</div>
			${S.right === 'use' ? paneUse(p) : S.right === 'chat' ? paneChat(p) : paneFiles()}
		</div>`
}

function renderTable() {
	const p = cur()
	const host = $('#mt')
	if (!p || !host) return render()
	host.innerHTML = tableHtml(p)
}

async function refresh() {
	const d = await api('/api/state')
	S.list = d.providers
	S.opts = d.options || S.opts
	S.claude = d.claude || null
	for (const p of S.list) {
		if (p.modelResults) {
			S.res[p.id] = { ...(p.modelResults || {}), ...(S.res[p.id] || {}) }
		}
	}
	if (!cur() && S.list.length) S.sel = S.list[0].id
	const p = cur()
	if (p?.model && !S.guides[p.id]?.[S.dest] && (S.dest !== 'codex' || p.installed)) {
		loadGuide(p.id)
	}
	render()
}

/* ═════════════════════════════════════════════ acciones */

async function runTest(id) {
	const p = S.list.find((x) => x.id === id)
	if (!p) return
	const btns = document.querySelectorAll(`[data-a="test"][data-p="${id}"]`)
	btns.forEach((b) => { b.disabled = true; b.innerHTML = '<span class="blink">●</span> Probando API...' })
	try {
		const r = await api('/api/test', { id })
		S.reports[id] = r
		S.res[id] = S.res[id] || {}
		for (const a of r.attempts || []) {
			S.res[id][a.model] = { model:a.model, ok:a.ok, httpStatus:a.httpStatus, detail:a.detail, target:a.target,
				reason: a.ok ? null : a.unavailable ? 'sin canal' : a.quota ? 'cuota agotada'
					: a.ambiguous ? 'no acepta este modelo' : 'error' }
		}
		await refresh()
		if (r.verdict === 'codex_ready') toast(`${p.label} funciona con "${r.testedModel}".`)
		else { S.fold.diag = true; render(); toast(`${p.label}: ${VERD[r.verdict]?.big || r.verdict}`, true) }
	} catch (e) { toast(e.message, true); render() }
}

async function loadCat(id, quiet) {
	const btns = document.querySelectorAll(`[data-a="cat"][data-p="${id}"], [data-a="cat"]`)
	btns.forEach((b) => { b.disabled = true; b.innerHTML = '<span class="blink">●</span> Cargando modelos...' })
	try {
		S.cats[id] = await api('/api/catalog', { id })
		if (!quiet) {
			const n = S.cats[id].models.length
			toast(n ? `${n} modelos disponibles` : (S.cats[id].error || 'Sin catalogo'), !n)
		}
	} catch (e) { if (!quiet) toast(e.message, true) }
	render()
}

async function openFile(which) {
	S.fileWhich = which
	try {
		S.file = await api('/api/file-read', { which })
		S.fileProblems = S.file.problems || []
		S.fileDirty = false
	} catch (e) {
		toast(e.message, true)
		S.file = null
	}
	render()
}

// Validacion mientras se escribe, sin guardar: avisa antes de intentarlo.
let checkTimer
function discardDirtyFile() {
	if (!S.fileDirty) return true
	if (!confirm('Hay cambios de archivo sin guardar. ¿Descartarlos y continuar?')) return false
	clearTimeout(checkTimer)
	S.file = null
	S.fileProblems = []
	S.fileDirty = false
	return true
}
function scheduleCheck(content) {
	clearTimeout(checkTimer)
	checkTimer = setTimeout(async () => {
		try {
			const r = await api('/api/file-check', { which: S.fileWhich, content })
			const before = S.fileProblems.join('|')
			S.fileProblems = r.problems || []
			// Solo se repinta si el veredicto cambio, para no perder el cursor.
			if (before !== S.fileProblems.join('|')) {
				const ta = $('#editor')
				const pos = ta ? ta.selectionStart : null
				const val = ta ? ta.value : null
				if (S.file) S.file.content = val ?? S.file.content
				render()
				const next = $('#editor')
				if (next && pos !== null) { next.focus(); next.setSelectionRange(pos, pos) }
			}
		} catch {}
	}, 400)
}

async function loadGuide(id) {
	try {
		const p = S.list.find((x) => x.id === id)
		const m = curModel(p)
		const guideKey = `${S.dest}:${m || 'none'}`
		const g = await api('/api/usage', { id, target: S.dest, model: m })
		S.guides[id] = { ...(S.guides[id] || {}), [guideKey]: g, [S.dest]: g }
		if (S.loadingGuide) delete S.loadingGuide[id + ':' + S.dest]
		render()
	} catch (e) {
		if (S.loadingGuide) delete S.loadingGuide[id + ':' + S.dest]
		toast(e.message, true)
	}
}

function stopScan() {
	if (S.scan) { S.scan.close(); S.scan = null }
	S.scanning = false
	render()
}

function startScan(id, models) {
	stopScan()
	S.scanning = true
	S.scanType = models ? 'sel' : 'all'
	S.res[id] = S.res[id] || {}
	if (models) {
		for (const m of models) delete S.res[id][m]
	}
	render()
	const prog = $('#prog'), bar = prog && $('.bar2 i', prog), txt = prog && $('.t', prog)
	if (prog) prog.hidden = false
	if (bar) bar.style.width = '10%'
	if (txt) txt.innerHTML = `<span class="blink">●</span> Iniciando prueba de ${models ? models.length + ' modelo(s)...' : 'todos los modelos...'}`
	const q = new URLSearchParams({ id })
	if (models?.length) q.set('models', models.join(','))
	let total = models?.length || 0
	const es = new EventSource('/api/scan?' + q)
	S.scan = es
	es.addEventListener('start', (e) => {
		const d = JSON.parse(e.data)
		total = d.total || total
		if (txt) txt.innerHTML = `<span class="blink">●</span> Probando [0/${total}]...`
	})
	es.addEventListener('result', (e) => {
		const r = JSON.parse(e.data)
		S.res[id][r.model] = r
		if (bar && total) bar.style.width = Math.round((r.done / total) * 100) + '%'
		if (txt) txt.innerHTML = `[${r.done}/${total}] ${esc(r.model)} &rarr; ${resultHtml(r)}<span class="blink">_</span>`
		renderTable()
	})
	es.addEventListener('done', (e) => {
		const d = JSON.parse(e.data)
		if (bar) bar.style.width = '100%'
		if (txt) txt.innerHTML = `Completado: ${d.working.length} modelo(s) respondieron; revisa el protocolo.`
		toast(d.working.length ? `${d.working.length} modelo(s) responden. Revisa el protocolo antes de usarlos.`
			: 'Ninguno respondio. Prueba con otros modelos.', !d.working.length)
		stopScan()
	})
	es.addEventListener('error', (e) => {
		let m = 'Error en el barrido'
		try { m = JSON.parse(e.data).message || m } catch {}
		toast(m, true); stopScan()
	})
	es.onerror = () => { if (S.scan) stopScan() }
}

document.addEventListener('click', async (e) => {
	if (e.target.closest('#modal') && !e.target.closest('.box')) return closeModal()
	const el = e.target.closest('[data-a]')
	if (!el || el.tagName === 'FORM' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return
	const { a, p: pid, m, k, f, d, t } = el.dataset
	const id = pid || S.sel

	if (a === 'sel') {
		if (S.sel !== id && !discardDirtyFile()) return
		if (S.sel !== id) { S.sel = id; S.q = ''; S.picked.clear(); S.fold = {}; stopScan() }
		S.adding = S.editing = false
		render()
		if (!S.cats[id]) loadCat(id, true)
		if (cur()?.model && !S.guides[id]?.[S.dest]) loadGuide(id)
		return
	}
	if (a === 'add') {
		if (!discardDirtyFile()) return
		S.adding = true; S.editing = false; render(); $('#q-l')?.focus(); return
	}
	if (a === 'edit') {
		if (!discardDirtyFile()) return
		return openProviderEditor(id, el)
	}
	if (a === 'cancel') { S.adding = S.editing = false; S.conflict = null; render(); return }
	if (a === 'fold') { S.fold[k] = !S.fold[k]; return render() }
	if (a === 'dest') {
		S.dest = d
		render()
		if (cur()?.model && !S.guides[S.sel]?.[d]) loadGuide(S.sel)
		return
	}
	if (a === 'right') {
		if (S.right === 'files' && d !== 'files' && !discardDirtyFile()) return
		S.right = d
		render()
		if (d === 'files' && !S.file) await openFile(S.fileWhich)
		return
	}
	if (a === 'file') {
		if (!discardDirtyFile()) return
		S.right = 'files'
		await openFile(el.dataset.w || S.fileWhich)
		return
	}
	if (a === 'filereload') {
		if (!discardDirtyFile()) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Recargando...'
		return openFile(S.fileWhich)
	}
	if (a === 'filesave') {
		const ta = $('#editor')
		if (!ta) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Guardando...'
		try {
			const r = await api('/api/file-write', { which: S.fileWhich, content: ta.value })
			S.fileDirty = false
			toast(`Guardado en ${r.path}${r.backedUp ? ' (respaldo hecho)' : ''}`)
			await openFile(S.fileWhich)
			if (S.fileWhich === 'codex') { try { S.cfg = await api('/api/config') } catch {} }
			render()
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Guardar' }
		return
	}
	if (a === 'cfg') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Leyendo...'
		try { S.cfg = await api('/api/config'); S.fold.toml = true; render() }
		catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Leer mi config.toml' }
		return
	}
	if (a === 'repair') {
		if (!confirm('Reparar config.toml? Se hace copia de respaldo y no se cambia tu proveedor activo.')) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Reparando...'
		try {
			const r = await api('/api/repair-config', {})
			S.cfg = r.after
			render()
			toast(r.changed ? 'config.toml reparado. Respaldo hecho.' : 'No habia nada que reparar.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Reparar duplicados' }
		return
	}
	if (a === 'clean') {
		const c = S.cfg
		if (!c) return
		const detalle = [
			c.orphans.length ? `quitar los bloques: ${c.orphans.join(', ')}` : null,
			c.legacyTuning.length ? 'quitar los reintentos que escribio el panel antes' : null,
		].filter(Boolean).join('\n')
		if (!confirm(`Limpiar config.toml?\n\n${detalle}\n\nNo se toca tu proveedor activo ni tus otras secciones. Se hace respaldo.`)) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Limpiando...'
		try {
			const r = await api('/api/clean-config', { removeTables: c.orphans, removeTuning: true })
			S.cfg = r.after
			render()
			toast(r.changed
				? `Limpio. Quitados: ${r.removedTables.join(', ') || '—'}${r.removedKeys.length ? ` y ${r.removedKeys.length} claves` : ''}.`
				: 'No habia nada que limpiar.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Limpiar' }
		return
	}
	if (a === 'plan') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Calculando...'
		try { const r = await api('/api/plan-install', { id }); S.plan = r.report; render() }
		catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Ver que cambiaria al instalar' }
		return
	}
	if (a === 'test') return runTest(id)
	if (a === 'cat') return loadCat(id)
	if (a === 'guide') return loadGuide(id)
	if (a === 'try') {
		S.trying = S.trying || new Set()
		S.trying.add(m)
		const prog = $('#prog'), bar = prog && $('.bar2 i', prog), txt = prog && $('.t', prog)
		if (prog) prog.hidden = false
		if (bar) bar.style.width = '65%'
		if (txt) txt.innerHTML = `Probando <b>${esc(m)}</b> en los protocolos disponibles <span class="blink">_</span>`
		renderTable()
		try {
			const t0 = Date.now()
			const r = await api('/api/test-model', { id, model: m })
			if (!r.ms) r.ms = Date.now() - t0
			S.res[id] = S.res[id] || {}
			S.res[id][m] = r
			if (bar) bar.style.width = '100%'
			if (txt) txt.innerHTML = `[1/1] ${esc(m)} &rarr; ${resultHtml(r)}`
			const protocol = protocolLabel(r)
			toast(r.ok ? `"${m}" responde${protocol ? ` por ${protocol}` : ''} (${r.ms} ms). Dale a "Usar" para activarlo.` : `"${m}": ${r.reason || 'falla'}`, !r.ok)
		} catch (err) {
			if (txt) txt.innerHTML = `<span style="color:var(--mag)">Error: ${esc(err.message)}</span>`
			toast(err.message, true)
		} finally {
			S.trying.delete(m)
			renderTable()
			setTimeout(() => {
				if (!S.scanning && (!S.trying || !S.trying.size)) {
					const p = $('#prog')
					if (p) p.hidden = true
				}
			}, 3000)
		}
		return
	}
	if (e.target.id === 'modal' || a === 'closemodal') {
		return closeModal()
	}
	if (a === 'toggle-key') {
		const targetId = el.dataset.target
		const input = $('#' + targetId)
		if (!input) return
		const real = input.dataset.real || ''
		if (!real) return
		if (input.value === real) {
			input.value = maskKey(real)
			el.textContent = 'Mostrar'
		} else {
			input.value = real
			el.textContent = 'Ocultar'
		}
		return
	}
	if (a === 'showallstatus') {
		return openAllStatusGuide()
	}
	if (a === 'showstatus') {
		return openSingleStatusGuide(id, m)
	}
	if (a === 'pickmodel') {
		S.selectedModel = S.selectedModel || {}
		S.selectedModel[id] = m
		delete S.guides[id]
		render()
		if (m) loadGuide(id)
		return
	}
	if (a === 'chatclear') {
		const targetModel = m || curModel(cur())
		if (S.chatMessages) delete S.chatMessages[id + ':' + targetModel]
		return render()
	}
	if (a === 'chatcancel') {
		const targetModel = m || curModel(cur())
		const key = id + ':' + targetModel
		if (S.chatControllers?.[key]) {
			S.chatControllers[key].abort()
			delete S.chatControllers[key]
		}
		S.chatSending = S.chatSending || {}
		S.chatSending[key] = false
		S.chatMessages = S.chatMessages || {}
		S.chatMessages[key] = S.chatMessages[key] || []
		S.chatMessages[key].push({ role: 'assistant', content: '⏹️ Petición cancelada.' })
		return render()
	}
	if (a === 'use') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Aplicando...'
		try {
			const targetModel = m || curModel(cur())
			const r = await api('/api/set-model', { id, model: targetModel })
			if (!cur()?.installed) {
				await api('/api/install', { id })
			}
			delete S.guides[id]
			await refresh()
			if (cur()?.model) loadGuide(id)
			toast(`Modelo "${targetModel}" configurado y activo en config.toml.`)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Usar' }
		return
	}
	if (a === 'filter') { S.filter = f; return render() }
	if (a === 'scanall') return startScan(id, null)
	if (a === 'scansel') {
		if (!S.picked.size) return toast('Marca primero los modelos que quieras probar', true)
		return startScan(id, [...S.picked])
	}
	if (a === 'scanstop') { stopScan(); return toast('Detenido') }
	if (a === 'install') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Instalando...'
		try {
			const r = await api('/api/install', { id })
			S.cfg = r.config || null
			S.plan = null
			delete S.guides[id]
			await refresh()
			await loadGuide(id)
			const rep = r.report?.repaired
			const fixed = (rep?.tables?.length || 0) + (rep?.keys?.length || 0) + (r.report?.relocated?.length || 0)
			toast(fixed ? `Instalado. Ademas se limpiaron ${fixed} problema(s) que tenia tu config.toml.`
				: 'Instalado. A la derecha tenes los 2 comandos.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Instalar en Codex' }
		return
	}

	if (a === 'applyclaude') {
		if (!confirm('Escribir la configuracion en el settings.json de Claude Code? Se hace copia de respaldo.')) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Escribiendo...'
		try {
			const r = await api('/api/apply-claude', { id })
			toast(`Escrito en ${r.file}${r.backedUp ? ' (respaldo hecho)' : ''}`)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Aplicar en settings.json' }
		return
	}
	if (a === 'del') {
		const pr = S.list.find((x) => x.id === id)
		if (!pr || !confirm(`Borrar "${pr.label}"?`)) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Borrando...'
		try {
			await api('/api/delete', { id })
			delete S.keys[id]
			delete S.guides[id]
			if (S.sel === id) S.sel = null
			await refresh()
			toast('Borrado')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Borrar' }
		return
	}
	if (a === 'copy') {
		const orig = el.innerHTML
		el.disabled = true
		el.innerHTML = '<span style="color:var(--lime)">✓ Copiado</span>'
		try { await navigator.clipboard.writeText(t); toast('Copiado') }
		catch { toast('El navegador bloqueo el portapapeles', true) }
		setTimeout(() => { el.disabled = false; el.innerHTML = orig }, 1400)
		return
	}
	if (a === 'use-existing') {
		const cid = S.conflict.conflict.id
		S.conflict = null; S.adding = S.editing = false; S.sel = cid
		closeModal(); render()
		if (!S.cats[cid]) loadCat(cid, true)
		return
	}
	if (a === 'force') {
		const payload = { ...S.conflict.payload, force: true }
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Guardando...'
		try {
			const r = await api('/api/provider', payload)
			S.conflict = null; closeModal()
			S.adding = S.editing = false
			S.sel = r.provider.id
			S.keys[r.provider.id] = payload.apiKey
			delete S.guides[r.provider.id]
			await refresh()
			await runTest(r.provider.id)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Forzar guardado' }
		return
	}
	if (a === 'chatclear') {
		if (S.chatMessages?.[id]) S.chatMessages[id] = []
		render()
		return
	}
	if (a === 'closemodal') return closeModal()
})

document.addEventListener('input', (e) => {
	const q = e.target.closest('[data-a="q"]')
	if (q) { S.q = q.value; return renderTable() }
	const ed = e.target.closest('#editor, [data-a="fileeditor"]')
	if (ed) {
		S.fileDirty = true
		if (S.file) S.file.content = ed.value
		scheduleCheck(ed.value)
	}
})

document.addEventListener('change', async (e) => {
	const one = e.target.closest('[data-a="pick"]')
	if (one) {
		one.checked ? S.picked.add(one.dataset.m) : S.picked.delete(one.dataset.m)
		const b = $('[data-a="scansel"]')
		if (b && !S.scanning) b.textContent = `Probar selección (${S.picked.size})`
		return
	}
	const all = e.target.closest('[data-a="pickall"]')
	if (all) {
		for (const r of rows(cur())) all.checked ? S.picked.add(r.m) : S.picked.delete(r.m)
		renderTable()
		const b = $('[data-a="scansel"]')
		if (b && !S.scanning) b.textContent = `Probar selección (${S.picked.size})`
		return
	}
	const cm = e.target.closest('[data-a="chatmodel"]')
	if (cm) {
		const pid = cm.dataset.p || S.sel
		const model = cm.value
		if (!model) return
		try {
			await api('/api/set-model', { id: pid, model })
			delete S.guides[pid]
			await refresh()
			if (cur()?.model) loadGuide(pid)
			toast(`Modelo activo para Chat y Codex: "${model}"`)
		} catch (err) {
			toast(err.message, true)
		}
		return
	}
})

document.addEventListener('submit', async (e) => {
	const chatForm = e.target.closest('form[data-a="chatsend"]')
	if (chatForm) {
		e.preventDefault()
		const pid = chatForm.dataset.p
		const m = chatForm.dataset.m || curModel(cur())
		const inp = $('#chat-inp')
		const text = inp ? inp.value.trim() : ''
		if (!text) return
		inp.value = ''
		const key = pid + ':' + m
		S.chatMessages = S.chatMessages || {}
		S.chatMessages[key] = S.chatMessages[key] || []
		S.chatMessages[key].push({ role: 'user', content: text })
		S.chatSending = S.chatSending || {}
		S.chatSending[key] = true
		const ctrl = new AbortController()
		S.chatControllers = S.chatControllers || {}
		S.chatControllers[key] = ctrl
		render()
		const scrollLog = () => { const l = $('#chat-log'); if (l) l.scrollTop = l.scrollHeight }
		scrollLog()

		if (!m) {
			toast('Selecciona un modelo primero', true)
			S.chatSending[key] = false
			delete S.chatControllers[key]
			render()
			return
		}
		try {
			const res = await api('/api/chat', {
				id: pid,
				model: m,
				messages: S.chatMessages[key].map((item) => ({ role: item.role, content: item.content })),
			}, ctrl.signal)
			delete S.chatControllers[key]
			S.chatMessages[key].push({
				role: 'assistant',
				content: res.reply,
				ms: res.ms,
				protocol: res.protocol || res.target,
				retries: res.retries || 0,
			})
		} catch (err) {
			if (err.name === 'AbortError' || err.message?.includes('aborted')) return
			delete S.chatControllers?.[key]
			S.chatMessages[key].push({ role: 'assistant', content: `❌ Error: ${err.message}` })
		} finally {
			S.chatSending[key] = false
			delete S.chatControllers?.[key]
			render()
			scrollLog()
			$('#chat-inp')?.focus()
		}
		return
	}
	const cfgForm = e.target.closest('form[data-a="savecfg"]')
	if (cfgForm) {
		e.preventDefault()
		const pid = cfgForm.dataset.p
		const p = S.list.find((x) => x.id === pid)
		const g = (n) => cfgForm.querySelector(`[name=${n}]`)?.value ?? ''
		const btn = cfgForm.querySelector('button[type=submit]')
		btn.disabled = true
		btn.innerHTML = '<span class="blink">●</span> Guardando ajustes...'
		try {
			await api('/api/provider', {
				id: pid, label: p.label, baseUrl: p.baseUrl,
				effort: g('effort'),
				approvalPolicy: g('approvalPolicy'),
				sandboxMode: g('sandboxMode'),
				envKey: g('envKey'),
			})
			// Si ya estaba instalado, se aplica al archivo en el momento.
			if (p.installed) {
				await api('/api/install', { id: pid })
				try { S.cfg = await api('/api/config') } catch {}
				delete S.guides[pid]
			}
			await refresh()
			if (p.installed) await loadGuide(pid)
			if (S.file && S.fileWhich === 'codex') await openFile('codex')
			toast(p.installed ? 'Ajustes guardados y aplicados a config.toml' : 'Ajustes guardados')
		} catch (err) { toast(err.message, true); btn.disabled = false; btn.textContent = 'Guardar ajustes' }
		return
	}
	const form = e.target.closest('form[data-a="save"]')
	if (!form) return
	e.preventDefault()
	const pid = form.dataset.p
	const isNew = pid === 'new'
	const btn = form.querySelector('button[type=submit]')
	btn.disabled = true
	btn.innerHTML = `<span class="blink">●</span> ${isNew ? 'Agregando...' : 'Guardando...'}`
	try {
		const g = (n) => form.querySelector(`[name=${n}]`)
		const keyInput = g('apiKey')
		let apiKeyVal = keyInput?.value?.trim() || ''
		const realKey = keyInput?.dataset?.real || ''
		if (realKey && (apiKeyVal === maskKey(realKey) || !apiKeyVal)) {
			apiKeyVal = realKey
		}
		const payload = {
			id: isNew ? null : pid,
			label: g('label')?.value?.trim() || '',
			baseUrl: g('baseUrl')?.value?.trim() || '',
			apiKey: apiKeyVal,
			useBridge: Boolean(g('useBridge')?.checked),
		}
		const r = await api('/api/provider', payload)
		if (r.conflict) {
			S.conflict = { conflict: r.conflict, payload }
			const c = r.conflict
			modal('Ya tenes esta API', `<div class="note bad"><span class="i">!</span><div>
				<p>${esc(c.message)}</p>
				${c.installed ? `<p>"${esc(c.label)}" ya esta instalado${c.model ? ` con <code>${esc(c.model)}</code>` : ''}.
					Si solo queres otro modelo, abrila y usa el panel de modelos: no hace falta otra API.</p>` : ''}
			</div></div>
			<div class="row" style="margin-top:13px">
				<button class="b go" data-a="use-existing">Abrir "${esc(c.label)}"</button>
				<button class="b" data-a="force">Crear otra igual</button>
				<button class="b" data-a="closemodal">Cancelar</button>
			</div>`)
			btn.disabled = false
			btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
			return
		}
		S.adding = S.editing = false
		S.sel = r.provider.id
		S.keys[r.provider.id] = payload.apiKey
		delete S.guides[r.provider.id]
		await refresh()
		if (isNew) { await loadCat(r.provider.id, true); await runTest(r.provider.id) }
		else toast('Guardado')
	} catch (err) {
		toast(err.message, true)
		btn.disabled = false
		btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
	}
})

$('#add').addEventListener('click', () => {
	if (!discardDirtyFile()) return
	S.adding = true; S.editing = false; render(); $('#q-l')?.focus()
})

window.addEventListener('beforeunload', (e) => {
	if (!S.fileDirty) return
	e.preventDefault()
	e.returnValue = ''
})

document.addEventListener('keydown', (e) => {
	if (e.key !== 'Escape') return
	if ($('#modal').classList.contains('show')) return closeModal()
	if (S.scan) { stopScan(); toast('Detenido') }
})

refresh()
	.then(async () => {
		const p = cur()
		if (p && !S.cats[p.id]) loadCat(p.id, true)
		// Se lee el config real de entrada, para poder avisar si esta roto.
		try {
			S.cfg = await api('/api/config')
			if (S.cfg.exists && (!S.cfg.healthy || !S.cfg.clean)) {
				S.fold.toml = true
				render()
				toast(!S.cfg.healthy
					? 'Tu config.toml tiene errores que rompen a Codex. Mira "Tu config.toml".'
					: 'Tu config.toml esta valido pero tiene cosas de sobra. Mira "Tu config.toml".', !S.cfg.healthy)
			}
		} catch {}
	})
	.catch((e) => toast(e.message, true))
</script>
