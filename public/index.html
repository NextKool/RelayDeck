}

function renderTable() {
	const p = cur()
	const host = $('#mt')
	if (!p || !host) return render()
	host.innerHTML = tableHtml(p)
	const ch = $('#mchips')
	if (ch) ch.innerHTML = chipsHtml(p)
}

async function refresh() {
	const d = await api('/api/state')
	S.list = d.providers
	S.opts = d.options || S.opts
	S.claude = d.claude || null
	if (!cur() && S.list.length) S.sel = S.list[0].id
	const p = cur()
	if (p?.model && !S.guides[p.id]?.[S.dest]) {
		loadGuide(p.id)
	}
	render()
}

/* ═════════════════════════════════════════════ acciones */

async function runTest(id) {
	const p = S.list.find((x) => x.id === id)
	if (!p) return
	const btns = document.querySelectorAll(`[data-a="test"][data-p="${id}"]`)
	btns.forEach((b) => { b.disabled = true; b.innerHTML = '<span class="blink">●</span> Probando API...' })
	try {
		const r = await api('/api/test', { id })
		S.reports[id] = r
		S.res[id] = S.res[id] || {}
		for (const a of r.attempts || []) {
			S.res[id][a.model] = { model:a.model, ok:a.ok, httpStatus:a.httpStatus, detail:a.detail, target:a.target,
				reason: a.ok ? null : a.unavailable ? 'sin canal' : a.quota ? 'cuota agotada'
					: a.ambiguous ? 'no acepta este modelo' : 'error' }
		}
		await refresh()
		if (r.verdict === 'codex_ready') toast(`${p.label}: Conexión directa a Responses verificada con "${r.testedModel}".`)
		else if (r.verdict === 'chat_only' || r.verdict === 'no_responses') toast(`${p.label}: Verificado por Chat Completions (requiere traductor local).`)
		else { S.fold.diag = true; render(); toast(`${p.label}: ${VERD[r.verdict]?.big || r.verdict}`, true) }
	} catch (e) { toast(e.message, true); render() }
}

async function loadCat(id, quiet) {
	S.loadingCat = S.loadingCat || {}
	S.loadingCat[id] = true
	const btns = document.querySelectorAll(`[data-a="cat"][data-p="${id}"], [data-a="cat"]`)
	btns.forEach((b) => { b.disabled = true; b.innerHTML = '<span class="blink">●</span> Cargando modelos...' })
	render()
	try {
		S.cats[id] = await api('/api/catalog', { id })
		if (!quiet) {
			const n = S.cats[id]?.models?.length || 0
			toast(n ? `${n} modelos disponibles` : (S.cats[id]?.error || 'Sin catalogo'), !n)
		}
	} catch (e) {
		S.cats[id] = { models: [], error: e.message }
		if (!quiet) toast(e.message, true)
	} finally {
		if (S.loadingCat) delete S.loadingCat[id]
		render()
	}
}

async function openFile(which) {
	S.fileWhich = which
	try {
		S.file = await api('/api/file-read', { which })
		S.fileProblems = S.file.problems || []
		S.fileDirty = false
	} catch (e) {
		toast(e.message, true)
		S.file = null
	}
	render()
}

// Validacion mientras se escribe, sin guardar: avisa antes de intentarlo.
let checkTimer
async function discardDirtyFile() {
	if (!S.fileDirty) return true
	const ok = await confirmModal(
		'Cambios sin guardar',
		'Tienes cambios de archivo sin guardar en el editor. ¿Deseas descartarlos y continuar?',
		{ confirmText: 'Descartar cambios', danger: true }
	)
	if (!ok) return false
	clearTimeout(checkTimer)
	S.file = null
	S.fileProblems = []
	S.fileDirty = false
	return true
}
function scheduleCheck(content) {
	clearTimeout(checkTimer)
	checkTimer = setTimeout(async () => {
		try {
			const r = await api('/api/file-check', { which: S.fileWhich, content })
			const before = S.fileProblems.join('|')
			S.fileProblems = r.problems || []
			// Solo se repinta si el veredicto cambio, para no perder el cursor.
			if (before !== S.fileProblems.join('|')) {
				const ta = $('#editor')
				const pos = ta ? ta.selectionStart : null
				const val = ta ? ta.value : null
				if (S.file) S.file.content = val ?? S.file.content
				render()
				const next = $('#editor')
				if (next && pos !== null) { next.focus(); next.setSelectionRange(pos, pos) }
			}
		} catch {}
	}, 400)
}

async function loadGuide(id) {
	try {
		const p = S.list.find((x) => x.id === id)
		const m = curModel(p)
		const guideKey = `${S.dest}:${m || 'none'}`
		const g = await api('/api/usage', { id, target: S.dest, model: m, effort: p?.effort || 'high' })
		S.guides[id] = { ...(S.guides[id] || {}), [guideKey]: g, [S.dest]: g }
		if (S.loadingGuide) delete S.loadingGuide[id + ':' + S.dest]
		render()
	} catch (e) {
		if (S.loadingGuide) delete S.loadingGuide[id + ':' + S.dest]
		toast(e.message, true)
	}
}

function stopScan() {
	if (S.scan) { S.scan.close(); S.scan = null }
	S.scanning = false
	render()
}

function startScan(id, models) {
	stopScan()
	S.scanning = true
	S.scanType = models ? 'sel' : 'all'
	S.scanModels = models ? new Set(models) : null
	S.res[id] = S.res[id] || {}
	if (models) {
		for (const m of models) delete S.res[id][m]
	} else {
		S.res[id] = {}
		S.filter = 'all'
	}
	render()
	const prog = $('#prog'), bar = prog && $('.bar2 i', prog), txt = prog && $('.t', prog)
	if (prog) prog.hidden = false
	if (bar) bar.style.width = '10%'
	if (txt) txt.innerHTML = `<span class="blink">●</span> Iniciando prueba de ${models ? models.length + ' modelo(s)...' : 'todos los modelos...'}`
	const q = new URLSearchParams({ id })
	if (models?.length) q.set('models', models.join(','))
	let total = models?.length || 0
	const es = new EventSource('/api/scan?' + q)
	S.scan = es
	es.addEventListener('start', (e) => {
		const d = JSON.parse(e.data)
		total = d.total || total
		if (txt) txt.innerHTML = `<span class="blink">●</span> Probando [0/${total}]...`
	})
	es.addEventListener('result', (e) => {
		const r = JSON.parse(e.data)
		S.res[id] = S.res[id] || {}
		S.res[id][r.model] = r
		if (S.cats[id] && Array.isArray(S.cats[id].models) && !S.cats[id].models.includes(r.model)) {
			S.cats[id].models.push(r.model)
		}
		if (bar && total) bar.style.width = Math.round((r.done / total) * 100) + '%'
		if (txt && total) txt.innerHTML = `<span class="blink">●</span> Probando [${r.done}/${total}]...`
		if (curModel(cur()) === r.model) {
			if (r.ok) { delete S.guides[id]; loadGuide(id) }
			render()
		} else {
			renderTable()
		}
	})
	es.addEventListener('done', (e) => {
		const d = JSON.parse(e.data)
		if (bar) bar.style.width = '100%'
		if (txt) txt.innerHTML = `Completado: ${d.working.length} modelo(s) respondieron; revisa el protocolo.`
		toast(d.working.length ? `${d.working.length} modelo(s) responden. Revisa el protocolo antes de usarlos.`
			: 'Ninguno respondio. Prueba con otros modelos.', !d.working.length)
		stopScan()
	})
	es.addEventListener('error', (e) => {
		let m = 'Error en el barrido'
		try { m = JSON.parse(e.data).message || m } catch {}
		toast(m, true); stopScan()
	})
	es.onerror = () => { if (S.scan) stopScan() }
}

/* ═════════════════════════════════════════════ eventos */

document.addEventListener('click', async (e) => {
	if (e.target.closest('#modal') && !e.target.closest('.box')) return closeModal()
	if (!e.target.closest('.c-select')) {
		$$('.c-select').forEach((cs) => {
			cs.classList.remove('open')
			const m = cs.querySelector('.c-select-menu')
			if (m) m.hidden = true
		})
	}
	const el = e.target.closest('[data-a]')
	if (!el || el.tagName === 'FORM' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return
	const { a, p: pid, m, k, f, d, t } = el.dataset
	const id = pid || S.sel

	if (a === 'sel') {
		if (S.sel !== id && !(await discardDirtyFile())) return
		if (S.sel !== id) { S.sel = id; S.q = ''; S.picked.clear(); S.fold = {}; stopScan() }
		S.adding = S.editing = false
		render()
		if (!S.cats[id]) loadCat(id, true)
		if (cur()?.model && !S.guides[id]?.[S.dest]) loadGuide(id)
		return
	}
	if (a === 'add') {
		if (!(await discardDirtyFile())) return
		S.adding = true; S.editing = false; render(); $('#q-l')?.focus(); return
	}
	if (a === 'edit') {
		if (!(await discardDirtyFile())) return
		return openProviderEditor(id, el)
	}
	if (a === 'cancel') { S.adding = S.editing = false; S.conflict = null; render(); return }
	if (a === 'fold') {
		const curVal = S.fold[k] !== undefined ? S.fold[k] : (el.getAttribute('aria-expanded') === 'true')
		S.fold[k] = !curVal
		return render()
	}
	if (a === 'dest') {
		S.dest = d
		render()
		if (cur()?.model && !S.guides[S.sel]?.[d]) loadGuide(S.sel)
		return
	}
	if (a === 'right') {
		if (S.right === 'files' && d !== 'files' && !(await discardDirtyFile())) return
		S.right = d
		render()
		if (d === 'files' && !S.file) await openFile(S.fileWhich)
		return
	}
	if (a === 'file') {
		if (!(await discardDirtyFile())) return
		S.right = 'files'
		await openFile(el.dataset.w || S.fileWhich)
		return
	}
	if (a === 'filereload') {
		if (!(await discardDirtyFile())) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Recargando...'
		return openFile(S.fileWhich)
	}
	if (a === 'filesave') {
		const ta = $('#editor')
		if (!ta) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Guardando...'
		try {
			const r = await api('/api/file-write', { which: S.fileWhich, content: ta.value })
			S.fileDirty = false
			toast(`Guardado en ${r.path}${r.backedUp ? ' (respaldo hecho)' : ''}`)
			await openFile(S.fileWhich)
			if (S.fileWhich === 'codex') { try { S.cfg = await api('/api/config') } catch {} }
			render()
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Guardar' }
		return
	}
	if (a === 'cfg') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Leyendo...'
		try { S.cfg = await api('/api/config'); S.fold.toml = true; render() }
		catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Leer mi config.toml' }
		return
	}
	if (a === 'repair') {
		const ok = await confirmModal(
			'Reparar config.toml',
			'¿Reparar la estructura y sintaxis de <code>config.toml</code>?<br><br>Se normalizarán claves y tablas rotas. Tu proveedor activo no será alterado y se creará una copia de respaldo automática.',
			{ confirmText: 'Reparar archivo' }
		)
		if (!ok) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Reparando...'
		try {
			const r = await api('/api/repair-config', {})
			S.cfg = r.after
			render()
			toast(r.changed ? 'config.toml reparado. Respaldo hecho.' : 'No había nada que reparar.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Reparar duplicados' }
		return
	}
	if (a === 'clean') {
		const c = S.cfg
		if (!c) return
		const detalle = [
			c.orphans?.length ? `• Eliminar bloques no gestionados por el panel: <b>${esc(c.orphans.join(', '))}</b>` : null,
			c.legacyTuning?.length ? `• Quitar claves obsoletas de reintento de red` : null,
		].filter(Boolean).join('<br>')
		const ok = await confirmModal(
			'Limpiar config.toml',
			`¿Deseas limpiar elementos obsoletos del archivo?<br><br>${detalle || 'Se limpiarán configuraciones obsoletas.'}<br><br><span style="color:var(--txt2);font-size:11.5px">Tu proveedor activo y otras secciones permanecen intactos. Se hace copia de respaldo automática.</span>`,
			{ confirmText: 'Limpiar archivo' }
		)
		if (!ok) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Limpiando...'
		try {
			const r = await api('/api/clean-config', { removeTables: c.orphans || [], removeTuning: true })
			S.cfg = r.after
			render()
			toast(r.changed
				? `Limpio. Quitados: ${r.removedTables.join(', ') || '—'}${r.removedKeys.length ? ` y ${r.removedKeys.length} claves` : ''}.`
				: 'El archivo ya está limpio.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Limpiar' }
		return
	}
	if (a === 'plan') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Calculando...'
		try { const r = await api('/api/plan-install', { id }); S.plan = r.report; render() }
		catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Ver que cambiaria al instalar' }
		return
	}
	if (a === 'test') return runTest(id)
	if (a === 'cat') return loadCat(id)
	if (a === 'guide') return loadGuide(id)
	if (a === 'try') {
		S.trying = S.trying || new Set()
		S.trying.add(m)
		if (el && el.matches('[data-a="try"]')) {
			el.disabled = true
			el.innerHTML = `<span class="blink">●</span> Probando ${esc(m)}...`
		}
		const prog = $('#prog'), bar = prog && $('.bar2 i', prog), txt = prog && $('.t', prog)
		if (prog) prog.hidden = false
		if (bar) bar.style.width = '65%'
		if (txt) txt.innerHTML = `Probando <b>${esc(m)}</b> en los protocolos disponibles <span class="blink">_</span>`
		render()
		setTimeout(() => {
			const tr = document.querySelector(`tr[data-m="${CSS.escape(m)}"]`)
			if (tr) tr.scrollIntoView({ behavior: 'smooth', block: 'center' })
		}, 30)
		try {
			const t0 = Date.now()
			const r = await api('/api/test-model', { id, model: m })
			if (!r.ms) r.ms = Date.now() - t0
			S.res[id] = S.res[id] || {}
			S.res[id][m] = r
			if (bar) bar.style.width = '100%'
			if (txt) txt.innerHTML = `[1/1] ${esc(m)} &rarr; ${resultHtml(r)}`
			const protocol = protocolLabel(r)
			toast(r.ok ? `"${m}" responde${protocol ? ` por ${protocol}` : ''} (${r.ms} ms). Dale a "Usar" para activarlo.` : `"${m}": ${r.reason || 'falla'}`, !r.ok)
			if (r.ok && curModel(cur()) === m) {
				delete S.guides[id]
				loadGuide(id)
			}
		} catch (err) {
			if (txt) txt.innerHTML = `<span style="color:var(--mag)">Error: ${esc(err.message)}</span>`
			toast(err.message, true)
		} finally {
			S.trying.delete(m)
			render()
			setTimeout(() => {
				if (!S.scanning && (!S.trying || !S.trying.size)) {
					const p = $('#prog')
					if (p) p.hidden = true
				}
			}, 3000)
		}
		return
	}
	if (e.target.id === 'modal' || a === 'closemodal') {
		return closeModal()
	}
	if (a === 'toggle-key') {
		const targetId = el.dataset.target
		const input = $('#' + targetId)
		if (!input) return
		const real = input.dataset.real || ''
		if (!real) return
		if (input.value === real) {
			input.value = maskKey(real)
			el.textContent = 'Mostrar'
		} else {
			input.value = real
			el.textContent = 'Ocultar'
		}
		return
	}
	if (a === 'open-c-select') {
		const selBox = el.closest('.c-select')
		const menu = selBox?.querySelector('.c-select-menu')
		if (!menu) return
		const isOpen = selBox.classList.contains('open')
		$$('.c-select').forEach((cs) => {
			cs.classList.remove('open')
			const m = cs.querySelector('.c-select-menu')
			if (m) m.hidden = true
		})
		if (!isOpen) {
			selBox.classList.add('open')
			menu.hidden = false
		}
		return
	}
	if (a === 'pick-c-select') {
		const selBox = el.closest('.c-select')
		const val = el.dataset.val ?? ''
		const name = el.dataset.name
		const label = el.dataset.label ?? (LABELS[val] ?? val)
		const hiddenInput = $(`#s-${name}`)
		if (hiddenInput) hiddenInput.value = val
		const labelEl = $(`#c-lbl-${name}`)
		if (labelEl) labelEl.textContent = label
		selBox?.querySelectorAll('.c-select-item').forEach((it) => {
			const isMatch = it.dataset.val === val
			it.classList.toggle('active', isMatch)
			const chk = it.querySelector('.c-select-check')
			if (chk) chk.remove()
			if (isMatch) {
				it.insertAdjacentHTML('beforeend', '<span class="c-select-check">✓</span>')
			}
		})
		if (selBox) selBox.classList.remove('open')
		const menu = selBox?.querySelector('.c-select-menu')
		if (menu) menu.hidden = true

		if (name === 'effort') {
			const p = cur()
			if (p) {
				p.effort = val
				delete S.guides[p.id]
				api('/api/set-effort', { id: p.id, effort: val }).then((r) => {
					if (r?.usage) {
						const gKey = `${S.dest}:${curModel(p) || 'none'}`
						S.guides[p.id] = { ...(S.guides[p.id] || {}), [gKey]: r.usage, [S.dest]: r.usage }
					}
				}).catch(() => {})
				// Sincronizar todos los selectores de effort en pantalla
				$$(`.c-select[data-name="effort"]`).forEach((box) => {
					const l = box.querySelector('.c-select-label')
					if (l) l.textContent = label
					box.querySelectorAll('.c-select-item').forEach((it) => {
						const match = it.dataset.val === val
						it.classList.toggle('active', match)
						const chk = it.querySelector('.c-select-check')
						if (chk) chk.remove()
						if (match) it.insertAdjacentHTML('beforeend', '<span class="c-select-check">✓</span>')
					})
				})
				$$(`input[name="effort"]`).forEach((inp) => { inp.value = val })
			}
		}
		return
	}
	if (a === 'test-effort') {
		const p = cur()
		if (!p) return
		const targetModel = m || curModel(p)
		if (!targetModel) return toast('Selecciona un modelo primero', true)
		const curEffort = p.effort || 'high'
		const key = p.id + ':' + targetModel
		S.effortTesting = S.effortTesting || {}
		S.effortTesting[key] = true
		render()
		try {
			const res = await api('/api/test-effort', { id: p.id, model: targetModel, effort: curEffort })
			S.effortTest = S.effortTest || {}
			S.effortTest[key] = res
			if (res.ok) {
				toast(`✓ Nivel "${res.effort}" aceptado por la API (${res.ms} ms)`)
			} else {
				toast(`✕ Error: ${res.error}`, true)
			}
		} catch (err) {
			S.effortTest = S.effortTest || {}
			S.effortTest[key] = { ok: false, error: err.message, effort: curEffort || 'default' }
			toast(`✕ Error al probar: ${err.message}`, true)
		} finally {
			S.effortTesting[key] = false
			render()
		}
		return
	}
	if (a === 'showallstatus') {
		return openAllStatusGuide()
	}
	if (a === 'showstatus') {
		return openSingleStatusGuide(id, m)
	}
	if (a === 'pickmodel') {
		S.selectedModel = S.selectedModel || {}
		S.selectedModel[id] = m
		delete S.guides[id]
		render()
		if (m) loadGuide(id)
		return
	}
	if (a === 'chatclear') {
		const targetModel = m || curModel(cur())
		if (S.chatMessages) delete S.chatMessages[id + ':' + targetModel]
		return render()
	}
	if (a === 'chatcancel') {
		const targetModel = m || curModel(cur())
		const key = id + ':' + targetModel
		if (S.chatControllers?.[key]) {
			S.chatControllers[key].abort()
			delete S.chatControllers[key]
		}
		S.chatSending = S.chatSending || {}
		S.chatSending[key] = false
		S.chatMessages = S.chatMessages || {}
		S.chatMessages[key] = S.chatMessages[key] || []
		S.chatMessages[key].push({ role: 'assistant', content: '⏹️ Petición cancelada.' })
		return render()
	}
	if (a === 'use') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Aplicando...'
		try {
			const targetModel = m || curModel(cur())
			const r = await api('/api/set-model', { id, model: targetModel })
			if (!cur()?.installed) {
				await api('/api/install', { id })
			}
			delete S.guides[id]
			await refresh()
			if (cur()?.model) loadGuide(id)
			toast(`Modelo "${targetModel}" configurado y activo en config.toml.`)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Usar' }
		return
	}
	if (a === 'register-table') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Registrando...'
		try {
			await api('/api/register-table', { id })
			delete S.guides[id]
			await refresh()
			if (cur()?.model) loadGuide(id)
			toast('Tabla registrada en config.toml. Ya puedes usar este proveedor en multiterminal sin alterar tu modelo por defecto.')
		} catch (err) {
			toast(err.message, true)
			el.disabled = false
			el.textContent = 'Registrar tabla en config.toml'
		}
		return
	}
	if (a === 'unset-active') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Restableciendo...'
		try {
			await api('/api/unset-active')
			delete S.guides[id || cur()?.id]
			await refresh()
			if (cur()?.model) loadGuide(id || cur()?.id)
			toast('Proveedor desvinculado de la raíz. Codex ahora usará ChatGPT oficial por defecto.')
		} catch (err) {
			toast(err.message, true)
			el.disabled = false
			el.textContent = 'Volver a ChatGPT oficial'
		}
		return
	}
	if (a === 'filter') { S.filter = f; return render() }
	if (a === 'scanall') {
		const catModels = S.cats[id]?.models
		return startScan(id, catModels && catModels.length ? catModels : null)
	}
	if (a === 'scansel') {
		if (!S.picked.size) return toast('Marca primero los modelos que quieras probar', true)
		return startScan(id, [...S.picked])
	}
	if (a === 'scanstop') { stopScan(); return toast('Detenido') }
	if (a === 'install') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Instalando...'
		try {
			const r = await api('/api/install', { id })
			S.cfg = r.config || null
			S.plan = null
			delete S.guides[id]
			await refresh()
			await loadGuide(id)
			const rep = r.report?.repaired
			const fixed = (rep?.tables?.length || 0) + (rep?.keys?.length || 0) + (r.report?.relocated?.length || 0)
			toast(fixed ? `Instalado. Además se corrigieron ${fixed} problema(s) que tenía tu config.toml.`
				: 'Instalado. A la derecha tienes los 2 comandos.')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Instalar en Codex' }
		return
	}

	if (a === 'applyclaude') {
		const ok = await confirmModal(
			'Fijar en Claude Code',
			'¿Escribir esta configuración en <code>~/.claude/settings.json</code>?<br><br>Se configurará de forma global en tu máquina, conservando los permisos en Modo YOLO y creando una copia de respaldo automática.',
			{ confirmText: 'Escribir configuración' }
		)
		if (!ok) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Escribiendo...'
		try {
			const r = await api('/api/apply-claude', { id })
			await refresh()
			if (cur()?.model) loadGuide(cur().id)
			toast(`Escrito en ${r.file}${r.backedUp ? ' (respaldo hecho)' : ''}`)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Aplicar en settings.json' }
		return
	}
	if (a === 'prepclaude') {
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Configurando...'
		try {
			await api('/api/prepare-claude-multiterminal')
			await refresh()
			if (cur()?.model) loadGuide(cur().id)
			toast('✓ Claude Code configurado para Multiterminal y Modo YOLO (permisos máximos sin confirmaciones).')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Configurar Claude para Multiterminal' }
		return
	}
	if (a === 'del') {
		const pr = S.list.find((x) => x.id === id)
		if (!pr) return
		const ok = await confirmModal(
			'Eliminar proveedor',
			`¿Estás seguro de eliminar a <b>${esc(pr.label)}</b>?<br><br><span style="color:var(--mag);font-size:11.5px">Esta acción no se puede deshacer y borrará las credenciales guardadas de este proveedor.</span>`,
			{ confirmText: 'Eliminar proveedor', danger: true }
		)
		if (!ok) return
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Borrando...'
		try {
			await api('/api/delete', { id })
			delete S.keys[id]
			delete S.guides[id]
			if (S.sel === id) S.sel = null
			await refresh()
			toast('Borrado')
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Borrar' }
		return
	}
	if (a === 'copy') {
		const orig = el.innerHTML
		el.disabled = true
		el.innerHTML = '<span style="color:var(--lime)">✓ Copiado</span>'
		try { await navigator.clipboard.writeText(t); toast('Copiado') }
		catch { toast('El navegador bloqueo el portapapeles', true) }
		setTimeout(() => { el.disabled = false; el.innerHTML = orig }, 1400)
		return
	}
	if (a === 'use-existing') {
		const cid = S.conflict?.conflict?.id
		S.conflict = null; S.adding = false; S.editing = true; S.sel = cid
		closeModal(); render()
		if (!S.cats[cid]) loadCat(cid, true)
		return
	}
	if (a === 'force') {
		const payload = { ...S.conflict.payload, force: true }
		el.disabled = true; el.innerHTML = '<span class="blink">●</span> Guardando...'
		try {
			const r = await api('/api/provider', payload)
			S.conflict = null; closeModal()
			S.adding = S.editing = false
			S.sel = r.provider.id
			S.keys[r.provider.id] = payload.apiKey
			delete S.guides[r.provider.id]
			await refresh()
			await runTest(r.provider.id)
		} catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Crear cuenta separada' }
		return
	}
	if (a === 'chatclear') {
		if (S.chatMessages?.[id]) S.chatMessages[id] = []
		render()
		return
	}
	if (a === 'closemodal' || a === 'modal-cancel') return closeModal()
	if (a === 'modal-confirm') {
		if (window._modalResolve) {
			const res = window._modalResolve
			window._modalResolve = null
			res(true)
		}
		return closeModal()
	}
})

document.addEventListener('input', (e) => {
	const q = e.target.closest('[data-a="q"]')
	if (q) { S.q = q.value; return renderTable() }
	const ed = e.target.closest('#editor, [data-a="fileeditor"]')
	if (ed) {
		S.fileDirty = true
		if (S.file) S.file.content = ed.value
		scheduleCheck(ed.value)
	}
})

document.addEventListener('change', async (e) => {
	const one = e.target.closest('[data-a="pick"]')
	if (one) {
		one.checked ? S.picked.add(one.dataset.m) : S.picked.delete(one.dataset.m)
		const b = $('[data-a="scansel"]')
		if (b && !S.scanning) b.textContent = `Probar selección (${S.picked.size})`
		return
	}
	const all = e.target.closest('[data-a="pickall"]')
	if (all) {
		for (const r of rows(cur())) all.checked ? S.picked.add(r.m) : S.picked.delete(r.m)
		renderTable()
		const b = $('[data-a="scansel"]')
		if (b && !S.scanning) b.textContent = `Probar selección (${S.picked.size})`
		return
	}
	const cm = e.target.closest('[data-a="chatmodel"]')
	if (cm) {
		const pid = cm.dataset.p || S.sel
		const model = cm.value
		if (!model) return
		try {
			await api('/api/set-model', { id: pid, model })
			delete S.guides[pid]
			await refresh()
			if (cur()?.model) loadGuide(pid)
			toast(`Modelo activo para Chat y Codex: "${model}"`)
		} catch (err) {
			toast(err.message, true)
		}
		return
	}
})

document.addEventListener('submit', async (e) => {
	const chatForm = e.target.closest('form[data-a="chatsend"]')
	if (chatForm) {
		e.preventDefault()
		const pid = chatForm.dataset.p
		const m = chatForm.dataset.m || curModel(cur())
		const inp = $('#chat-inp')
		const text = inp ? inp.value.trim() : ''
		if (!text) return
		inp.value = ''
		const key = pid + ':' + m
		S.chatMessages = S.chatMessages || {}
		S.chatMessages[key] = S.chatMessages[key] || []
		S.chatMessages[key].push({ role: 'user', content: text })
		S.chatSending = S.chatSending || {}
		S.chatSending[key] = true
		S.chatStarted = S.chatStarted || {}
		S.chatStarted[key] = Date.now()
		const CHAT_MAX_SEC = 15
		const ctrl = new AbortController()
		S.chatControllers = S.chatControllers || {}
		S.chatControllers[key] = ctrl
		let timedOut = false
		const abortTimer = setTimeout(() => {
			timedOut = true
			ctrl.abort()
		}, CHAT_MAX_SEC * 1000)

		render()
		const scrollLog = () => { const l = $('#chat-log'); if (l) l.scrollTop = l.scrollHeight }
		scrollLog()

		const timerId = setInterval(() => {
			const el = document.getElementById('chat-timer')
			if (!el) { clearInterval(timerId); return }
			const sec = Math.min(CHAT_MAX_SEC, Math.max(1, Math.round((Date.now() - (S.chatStarted?.[key] || Date.now())) / 1000)))
			el.textContent = `(${sec}s / ${CHAT_MAX_SEC}s máx${sec > 5 ? ' · esperando respuesta' : ''})`
		}, 1000)

		if (!m) {
			clearTimeout(abortTimer)
			clearInterval(timerId)
			toast('Selecciona un modelo primero', true)
			S.chatSending[key] = false
			delete S.chatControllers[key]
			delete S.chatStarted[key]
			render()
			return
		}
		try {
			const pObj = S.list.find((x) => x.id === pid)
			const res = await api('/api/chat', {
				id: pid,
				model: m,
				effort: pObj?.effort || undefined,
				messages: S.chatMessages[key].map((item) => ({ role: item.role, content: item.content })),
			}, ctrl.signal)
			delete S.chatControllers[key]
			S.chatMessages[key].push({
				role: 'assistant',
				content: res.reply,
				ms: res.ms,
				protocol: res.protocol || res.target,
				retries: res.retries || 0,
				effort: res.effort || pObj?.effort || null,
			})
		} catch (err) {
			if (timedOut) {
				S.chatMessages[key].push({ role: 'assistant', content: '⏱️ Tiempo de espera agotado (15s máx). El servidor tardó demasiado en responder.' })
			} else if (err.name === 'AbortError' || err.message?.includes('aborted')) {
				return
			} else {
				delete S.chatControllers?.[key]
				S.chatMessages[key].push({ role: 'assistant', content: `❌ Error: ${err.message}` })
			}
		} finally {
			clearTimeout(abortTimer)
			clearInterval(timerId)
			delete S.chatStarted?.[key]
			S.chatSending[key] = false
			delete S.chatControllers?.[key]
			render()
			scrollLog()
			$('#chat-inp')?.focus()
		}
		return
	}
	const cfgForm = e.target.closest('form[data-a="savecfg"]')
	if (cfgForm) {
		e.preventDefault()
		const pid = cfgForm.dataset.p
		const p = S.list.find((x) => x.id === pid)
		const g = (n) => cfgForm.querySelector(`[name=${n}]`)?.value ?? ''
		const btn = cfgForm.querySelector('button[type=submit]')
		btn.disabled = true
		btn.innerHTML = '<span class="blink">●</span> Guardando ajustes...'
		try {
			await api('/api/provider', {
				id: pid, label: p.label, baseUrl: p.baseUrl,
				effort: g('effort') || 'high',
				approvalPolicy: g('approvalPolicy'),
				sandboxMode: g('sandboxMode'),
				envKey: g('envKey'),
			})
			// Si ya estaba instalado, se aplica al archivo en el momento.
			if (p.installed) {
				await api('/api/install', { id: pid })
				try { S.cfg = await api('/api/config') } catch {}
				delete S.guides[pid]
			}
			await refresh()
			if (p.installed) await loadGuide(pid)
			if (S.file && S.fileWhich === 'codex') await openFile('codex')
			toast(p.installed ? 'Ajustes guardados y aplicados a config.toml' : 'Ajustes guardados')
		} catch (err) { toast(err.message, true); btn.disabled = false; btn.textContent = 'Guardar ajustes' }
		return
	}
	const form = e.target.closest('form[data-a="save"]')
	if (!form) return
	e.preventDefault()
	const pid = form.dataset.p
	const isNew = pid === 'new'
	const btn = form.querySelector('button[type=submit]')
	btn.disabled = true
	btn.innerHTML = `<span class="blink">●</span> ${isNew ? 'Agregando...' : 'Guardando...'}`
	try {
		const g = (n) => form.querySelector(`[name=${n}]`)
		const keyInput = g('apiKey')
		let apiKeyVal = keyInput?.value?.trim() || ''
		const realKey = keyInput?.dataset?.real || ''
		if (realKey && (apiKeyVal === maskKey(realKey) || !apiKeyVal)) {
			apiKeyVal = realKey
		}
		const labelVal = g('label')?.value?.trim() || ''
		if (!labelVal) {
			toast('El nombre es obligatorio', true)
			btn.disabled = false
			btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
			return
		}
		const cleanLabel = labelVal.toLowerCase()
		const dup = S.list.find((p) => {
			if (!isNew && p.id === pid) return false
			return p.label.trim().toLowerCase() === cleanLabel || p.id === cleanLabel
		})
		if (dup) {
			toast(`Ya existe un proveedor con el nombre "${dup.label}". Elige otro nombre.`, true)
			btn.disabled = false
			btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
			return
		}

		const payload = {
			id: isNew ? null : pid,
			label: labelVal,
			baseUrl: g('baseUrl')?.value?.trim() || '',
			apiKey: apiKeyVal,
			useBridge: Boolean(g('useBridge')?.checked),
		}
		const r = await api('/api/provider', payload)
		if (r.conflict) {
			S.conflict = { conflict: r.conflict, payload }
			const c = r.conflict
			modal('Mismo relay detectado', `<div class="note info"><span class="i">ℹ</span><div>
				<p>Ya tienes registrado <b>"${esc(c.label)}"</b> con esta misma URL.</p>
				<p style="margin-top:6px;color:var(--dim);font-size:11.5px">Si estás usando una segunda clave (tu cuenta personal, la de un amigo o una cuenta secundaria), puedes guardarla como una <b>cuenta separada</b> para trabajar en paralelo en distintas terminales sin interferencias.</p>
			</div></div>
			<div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px">
				<button class="b go" data-a="force">Crear cuenta separada</button>
				<button class="b" data-a="use-existing">Editar "${esc(c.label)}" existente</button>
				<button class="b" data-a="closemodal">Cancelar</button>
			</div>`)
			btn.disabled = false
			btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
			return
		}
		S.adding = S.editing = false
		S.sel = r.provider.id
		S.keys[r.provider.id] = payload.apiKey
		delete S.guides[r.provider.id]
		await refresh()
		if (isNew) { await loadCat(r.provider.id, true); await runTest(r.provider.id) }
		else toast('Guardado')
	} catch (err) {
		toast(err.message, true)
		btn.disabled = false
		btn.textContent = isNew ? 'Agregar y probar' : 'Guardar'
	}
})

$('#add').addEventListener('click', async () => {
	if (!(await discardDirtyFile())) return
	S.adding = true; S.editing = false; render(); $('#q-l')?.focus()
})

window.addEventListener('beforeunload', (e) => {
	if (!S.fileDirty) return
	e.preventDefault()
	e.returnValue = ''
})

document.addEventListener('keydown', (e) => {
	if (e.key !== 'Escape') return
	if ($('#modal').classList.contains('show')) return closeModal()
	if (S.scan) { stopScan(); toast('Detenido') }
})

refresh()
	.then(async () => {
		const p = cur()
		if (p && !S.cats[p.id]) loadCat(p.id, true)
		// Se lee el config real de entrada, para poder avisar si esta roto.
		try {
			S.cfg = await api('/api/config')
			if (S.cfg.exists && (!S.cfg.healthy || !S.cfg.clean)) {
				S.fold.toml = true
				render()
				toast(!S.cfg.healthy
					? 'Tu config.toml tiene errores que impiden el funcionamiento de Codex. Revisa "Tu config.toml".'
					: 'Tu config.toml es válido pero contiene elementos innecesarios. Revisa "Tu config.toml".', !S.cfg.healthy)
			}
		} catch {}
	})
	.catch((e) => toast(e.message, true))
</script>
